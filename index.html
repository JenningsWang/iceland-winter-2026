<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b42">
  <meta name="description" content="2026年12月5–12日冰岛自驾完整攻略。交互地图联动每日路线、游览点、五处住宿、沿线备选与冬季可达性。">
  <title>冰岛冬行地图 · 2026.12.05–12</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#detail-panel">跳到行程详情</a>
  <header class="site-header">
    <a class="brand" href="#overview" aria-label="冰岛冬行地图总览">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 3 35 34 20 27 5 34Z"/><path d="M20 3v24"/></svg></span>
      <span><span class="brand-kicker">ICELAND / WINTER JOURNAL</span><h1>冰岛冬行地图</h1></span>
    </a>
    <div class="trip-stamp"><strong>05 — 12 DEC 2026</strong><span>8 天 · 7 晚 · 5 处住宿</span></div>
    <div class="header-actions">
      <a class="live-link" href="https://umferdin.is/en" target="_blank" rel="noopener noreferrer"><span class="live-dot"></span>实时路况 ↗</a>
      <button class="button button-outline" data-action="open-guide"><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4Zm16 0h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h3Z"/></svg>完整攻略</button>
      <button class="button button-dark" data-action="share">分享此页</button>
    </div>
  </header>

  <nav class="day-strip" id="day-strip" aria-label="按旅行日期查看路线"></nav>

  <main class="workspace">
    <section class="map-shell" aria-label="冰岛交互旅行地图">
      <div id="map" role="region" aria-label="可缩放地图；点选景点、住宿或路线后在右侧阅读详情"></div>
      <div class="map-topbar">
        <div class="search-wrap">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input id="map-search" type="search" placeholder="搜索景点、住宿地或地区" aria-label="搜索景点、住宿地或地区" autocomplete="off">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="map-view-controls">
          <button class="map-button active" id="fit-trip" data-action="fit-trip">本次路线</button>
          <button class="map-button" id="fit-island" data-action="fit-island">全岛</button>
          <button class="map-button" id="layers-toggle" data-action="toggle-layers" aria-expanded="false" aria-controls="map-layers">图层 <span>☷</span></button>
        </div>
      </div>
      <section class="map-layers" id="map-layers" hidden aria-label="地图图层筛选">
        <div class="layer-heading"><strong>看你想看的</strong><button class="icon-button" data-action="toggle-layers" aria-label="收起图层">×</button></div>
        <fieldset><legend>行程关系 · 点的填色</legend>
          <label><input type="checkbox" data-filter="planned" checked><span class="legend-dot planned"></span>已规划景点</label>
          <label><input type="checkbox" data-filter="optional" checked><span class="legend-dot optional"></span>沿线备选</label>
          <label><input type="checkbox" data-filter="reference" checked><span class="legend-dot reference"></span>全岛参考</label>
          <label><input type="checkbox" data-filter="stays" checked><span class="legend-stay">H</span>住宿 · 正在预定</label>
          <label><input type="checkbox" data-filter="routes" checked><span class="legend-line"></span>本次路线</label>
          <label><input type="checkbox" data-filter="roads" checked><span class="legend-line road"></span>主干公路</label>
        </fieldset>
        <fieldset><legend>冬季可达性 · 外圈与符号</legend>
          <label><input type="checkbox" data-winter="usual" checked><span class="winter-ring usual">✓</span>通常可达</label>
          <label><input type="checkbox" data-winter="conditional" checked><span class="winter-ring conditional">!</span>依路况／开放区域</label>
          <label><input type="checkbox" data-winter="guided" checked><span class="winter-ring guided">G</span>需要正规向导</label>
          <label><input type="checkbox" data-winter="closed" checked><span class="winter-ring closed">×</span>普通冬季自驾不适用</label>
        </fieldset>
        <label class="basemap-option"><input type="checkbox" id="street-map-toggle">叠加在线街道底图</label>
        <p>冬季分类是规划参考，不代表当天开放状态。道路与天气请查看官方实时信息。</p>
      </section>
      <div class="map-caption" id="map-caption"><span class="caption-line"></span><span>点选地图，展开这段旅程</span></div>
      <div class="map-legend-mini" aria-label="地图简要图例">
        <span><i class="legend-dot planned"></i>已规划</span><span><i class="legend-dot optional"></i>沿线备选</span><span><i class="legend-stay">H</i>住宿</span><button data-action="toggle-layers">冬季状态看外圈 ⓘ</button>
      </div>
      <div id="map-load-note" class="map-load-note" hidden></div>
    </section>

    <aside class="detail-panel" id="detail-panel" aria-label="行程详情">
      <nav class="panel-tabs" aria-label="攻略内容分类">
        <button data-view="overview" class="active">总览</button>
        <button data-view="days">逐日</button>
        <button data-view="stays">住宿</button>
        <button data-view="optional">备选</button>
        <button data-view="essentials">出行</button>
      </nav>
      <div id="panel-content" class="panel-content" tabindex="-1"></div>
    </aside>
  </main>

  <footer class="site-footer"><span>行程共识版 · 核验于 <time datetime="2026-10-26">2026.10.26</time> · 时间均为冰岛当地时间 UTC+0</span><button data-view="sources">数据与来源 ↗</button></footer>
  <div class="toast" id="toast" role="status" hidden></div>
  <input type="file" id="booking-import" accept="application/json,.json" hidden>
  <dialog class="guide-dialog" id="guide-dialog" aria-labelledby="guide-title">
    <div class="guide-toolbar"><div><span class="eyebrow">THE COMPLETE JOURNAL</span><h2 id="guide-title">完整旅行攻略</h2></div><div><button class="button button-outline" data-action="print-guide">打印 / 保存 PDF</button><button class="icon-button" data-action="close-guide" aria-label="关闭完整攻略">×</button></div></div>
    <div id="guide-content" class="guide-content"></div>
  </dialog>
  <div id="print-guide" class="print-guide"></div>
  <noscript><div class="no-script">请启用 JavaScript 以浏览交互地图与完整攻略。所有行程数据都随网页提供，无需登录。</div></noscript>
  <script src="assets/vendor/leaflet.js"></script>
  <script src="data/trip.js"></script>
  <script src="data/points.js"></script>
  <script src="data/geo.js"></script>
  <script src="app.js"></script>
</body>
</html>
