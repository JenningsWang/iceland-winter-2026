<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b42">
  <meta name="description" content="2026年12月5–12日冰岛自驾完整攻略。交互地图联动每日路线、游览点、五处住宿、沿线备选与冬季可达性。">
  <title>冰岛冬行地图 · 2026.12.05–12</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#detail-panel" data-en="Skip to itinerary details">跳到行程详情</a>
  <header class="site-header">
    <a class="brand" href="#overview" aria-label="冰岛冬行地图总览" data-en-aria-label="Iceland Winter Map overview">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 3 35 34 20 27 5 34Z"/><path d="M20 3v24"/></svg></span>
      <span><span class="brand-kicker">ICELAND / WINTER JOURNAL</span><h1 data-en="Iceland Winter Map">冰岛冬行地图</h1></span>
    </a>
    <div class="trip-stamp"><strong>05 — 12 DEC 2026</strong><span data-en="8 days · 7 nights · 5 bases">8 天 · 7 晚 · 5 处住宿</span></div>
    <div class="header-actions">
      <a class="live-link" href="https://umferdin.is/en" target="_blank" rel="noopener noreferrer"><span class="live-dot"></span><span data-en="Road conditions ↗">实时路况 ↗</span></a>
      <button class="button button-outline" data-action="open-guide"><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4Zm16 0h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h3Z"/></svg><span data-en="Full guide">完整攻略</span></button>
      <button class="button button-dark" data-action="share" data-en="Share">分享此页</button>
      <button class="button button-outline language-toggle" id="language-toggle" data-action="toggle-language" lang="en" aria-label="Switch to English" title="Switch to English">English</button>
    </div>
  </header>

  <nav class="day-strip" id="day-strip" aria-label="按旅行日期查看路线" data-en-aria-label="View routes by travel day"></nav>

  <main class="workspace">
    <section class="map-shell" aria-label="冰岛交互旅行地图" data-en-aria-label="Interactive Iceland travel map">
      <div id="map" role="region" aria-label="可缩放地图；点选景点、住宿或路线后在右侧阅读详情" data-en-aria-label="Zoomable map; select a sight, stay or route to read its details"></div>
      <div class="map-topbar">
        <div class="search-wrap">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input id="map-search" type="search" placeholder="搜索景点、住宿地或地区" aria-label="搜索景点、住宿地或地区" data-en-placeholder="Search sights, stays or regions" data-en-aria-label="Search sights, stays or regions" autocomplete="off">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="map-view-controls">
          <button class="map-button active" id="fit-trip" data-action="fit-trip" data-en="Our route">本次路线</button>
          <button class="map-button" id="fit-island" data-action="fit-island" data-en="Iceland">全岛</button>
          <button class="map-button" id="layers-toggle" data-action="toggle-layers" aria-expanded="false" aria-controls="map-layers"><span data-en="Layers">图层</span> <span aria-hidden="true">☷</span></button>
        </div>
      </div>
      <section class="map-layers" id="map-layers" hidden aria-label="地图图层筛选" data-en-aria-label="Map layer filters">
        <div class="layer-heading"><strong data-en="Choose what to see">看你想看的</strong><button class="icon-button" data-action="toggle-layers" aria-label="收起图层" data-en-aria-label="Close layers">×</button></div>
        <fieldset><legend data-en="Trip inclusion · marker fill">行程关系 · 点的填色</legend>
          <label><input type="checkbox" data-filter="planned" checked><span class="legend-dot planned"></span><span data-en="Planned sights">已规划景点</span></label>
          <label><input type="checkbox" data-filter="optional" checked><span class="legend-dot optional"></span><span data-en="Along-route options">沿线备选</span></label>
          <label><input type="checkbox" data-filter="reference" checked><span class="legend-dot reference"></span><span data-en="Island-wide reference">全岛参考</span></label>
          <label><input type="checkbox" data-filter="stays" checked><span class="legend-stay">H</span><span data-en="Stays · booking in progress">住宿 · 正在预定</span></label>
          <label><input type="checkbox" data-filter="routes" checked><span class="legend-line"></span><span data-en="Our routes">本次路线</span></label>
          <label><input type="checkbox" data-filter="roads" checked><span class="legend-line road"></span><span data-en="Main roads">主干公路</span></label>
        </fieldset>
        <fieldset><legend data-en="Winter access · ring and symbol">冬季可达性 · 外圈与符号</legend>
          <label><input type="checkbox" data-winter="usual" checked><span class="winter-ring usual">✓</span><span data-en="Usually accessible">通常可达</span></label>
          <label><input type="checkbox" data-winter="conditional" checked><span class="winter-ring conditional">!</span><span data-en="Subject to roads and open areas">依路况／开放区域</span></label>
          <label><input type="checkbox" data-winter="guided" checked><span class="winter-ring guided">G</span><span data-en="Professional guide required">需要正规向导</span></label>
          <label><input type="checkbox" data-winter="closed" checked><span class="winter-ring closed">×</span><span data-en="Not for ordinary winter self-drive">普通冬季自驾不适用</span></label>
        </fieldset>
        <label class="basemap-option"><input type="checkbox" id="street-map-toggle"><span data-en="Overlay online street map">叠加在线街道底图</span></label>
        <p data-en="Winter categories are planning guidance, not live opening information. Check official road and weather updates before travelling.">冬季分类是规划参考，不代表当天开放状态。道路与天气请查看官方实时信息。</p>
      </section>
      <div class="map-caption" id="map-caption"><span class="caption-line"></span><span data-en="Select the map to explore the trip">点选地图，展开这段旅程</span></div>
      <div class="map-legend-mini" aria-label="地图简要图例" data-en-aria-label="Map legend">
        <span><i class="legend-dot planned"></i><span data-en="Planned">已规划</span></span><span><i class="legend-dot optional"></i><span data-en="Optional">沿线备选</span></span><span><i class="legend-stay">H</i><span data-en="Stays">住宿</span></span><button data-action="toggle-layers" data-en="Winter access: outer ring ⓘ">冬季状态看外圈 ⓘ</button>
      </div>
      <div id="map-load-note" class="map-load-note" hidden></div>
    </section>

    <aside class="detail-panel" id="detail-panel" aria-label="行程详情" data-en-aria-label="Trip details">
      <nav class="panel-tabs" aria-label="攻略内容分类" data-en-aria-label="Guide sections">
        <button data-view="overview" class="active" data-en="Overview">总览</button>
        <button data-view="days" data-en="Days">逐日</button>
        <button data-view="stays" data-en="Stays">住宿</button>
        <button data-view="optional" data-en="Options">备选</button>
        <button data-view="essentials" data-en="Travel">出行</button>
      </nav>
      <div id="panel-content" class="panel-content" tabindex="-1"></div>
    </aside>
  </main>

  <footer class="site-footer"><span><span data-en="Agreed itinerary · Sources checked ">行程共识版 · 核验于 </span><time datetime="2026-10-26">2026.10.26</time><span data-en=" · All times are Iceland local time, UTC+0"> · 时间均为冰岛当地时间 UTC+0</span></span><button data-view="sources" data-en="Data &amp; sources ↗">数据与来源 ↗</button></footer>
  <div class="toast" id="toast" role="status" hidden></div>
  <input type="file" id="booking-import" accept="application/json,.json" hidden>
  <dialog class="guide-dialog" id="guide-dialog" aria-labelledby="guide-title">
    <div class="guide-toolbar"><div><span class="eyebrow">THE COMPLETE JOURNAL</span><h2 id="guide-title" data-en="Complete travel guide">完整旅行攻略</h2></div><div><button class="button button-outline" data-action="print-guide" data-en="Print / Save PDF">打印 / 保存 PDF</button><button class="icon-button" data-action="close-guide" aria-label="关闭完整攻略" data-en-aria-label="Close complete guide">×</button></div></div>
    <div id="guide-content" class="guide-content"></div>
  </dialog>
  <div id="print-guide" class="print-guide"></div>
  <noscript><div class="no-script">请启用 JavaScript 以浏览交互地图与完整攻略。无需登录。<br>Enable JavaScript to explore the interactive map and full guide. No sign-in is required.</div></noscript>
  <script src="assets/vendor/leaflet.js"></script>
  <script src="data/trip.js"></script>
  <script src="data/trip-en.js"></script>
  <script src="data/points.js"></script>
  <script src="data/points-en.js"></script>
  <script src="data/geo.js"></script>
  <script src="data/language.js"></script>
  <script src="app.js"></script>
</body>
</html>
